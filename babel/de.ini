[meta]
name = German (Germany)
language = de
flag = 🇩🇪
contributors = 3n3scan, Gemini, Yiays
inherit = 

[main]
extension_enable_success = `{extension}` ist so konfiguriert, dass es beim Start geladen wird.
extension_disable_success = `{extension}` ist so konfiguriert, dass es beim Start nicht geladen wird.
extension_load_success = `{extension}` erfolgreich geladen!
extension_unload_success = `{extension}` erfolgreich entladen!
extension_reload_success = `{extension}` erfolgreich neu geladen!
extension_file_missing = Die Quelldatei für diese Erweiterung ist verschwunden!
extension_not_found = Der von dir angegebene Erweiterungsname stimmt mit keiner verfügbaren Erweiterung überein.
extensions_list = Hier sind alle derzeit aktivierten Erweiterungen
	```
	{list}
	```
list_conjunction = ,_
list_conjunction_2 = _und_
list_conjunction_2_or = _oder_
list_last_conjunction = ,_und_
list_last_conjunction_or = ,_oder_

[language]
command_language = sprache
command_language_desc = Verwalte die Sprache, die {c:main/botname} mit dir und anderen verwendet (wenn du Admin bist).
command_language_list = liste
command_language_list_desc = Listet alle Sprachen auf, die {c:main/botname} sprechen kann.
command_language_get = abrufen
command_language_get_desc = Erklärt, wie {c:main/botname} bestimmt, welche Sprache mit dir verwendet wird.
command_language_set = festlegen
command_language_set_desc = Lege die Sprache fest, die von {c:main/botname} mit dir oder auf diesem Server verwendet wird (wenn du Admin bist).
command_language_set_language_desc = ISO-Sprachcode für deine Sprache und deinen Dialekt. Z.B. "pt-BR" oder "de".
command_language_help = {p:{cmd}} (abrufen|festlegen (langcode)|liste)
	Ändert die Sprache, die verwendet wird, wenn mit dir *oder deinem Server* gesprochen wird. Verwende {p:{cmd} list}, um Übersetzungen zu finden, und lege dann eine fest.
	Nur Admins können die Serversprache ändern.
user_language_override = Deine Sprachüberschreibung
guild_language_override = Server-Sprachüberschreibung
list_title = Verfügbare Sprachen
set_howto = Lege eine Sprache fest, indem du {p:language set} und einen der unten stehenden Sprachcodes verwendest.
contribute_cta = Trage hier zur Übersetzung bei: {c:language/contribute_url}
unknown_contributors = Keine Mitwirkenden angegeben
coverage_label = Übersetzt: {coverage}%%
origin_reason_author = Du hast diese Sprache persönlich über {p:language set} angefordert.
origin_reason_author_locale = Als deine Sprache in den Discord-Benutzereinstellungen festgelegt.{backup? - Wird verwendet, wenn den obigen Sprachen eine Übersetzung fehlt.|}
origin_reason_guild = Ein Admin hat dies per Befehl als Standardsprache für diesen Server festgelegt.{backup? - Wird verwendet, wenn den obigen Sprachen eine Übersetzung fehlt.|}
origin_reason_guild_locale = Als Sprache dieses Servers in den Servereinstellungen festgelegt.{backup? - Wird verwendet, wenn den obigen Sprachen eine Übersetzung fehlt.|}
origin_reason_default = Die Hauptsprache, in der dieser Bot geschrieben ist.{backup? - Wird verwendet, wenn den obigen Sprachen eine Übersetzung fehlt.|}
origin_reason_inherit = Die obige Sprache hängt von dieser Sprachdatei ab.
set_failed_invalid_pattern = Dein Sprachcode muss in das Muster passen. (d. h. en oder br-PT, hierbei wird zwischen Groß- und Kleinschreibung unterschieden).
set_warning_no_match = Diese Sprache wurde noch nicht übersetzt, aber falls doch, gehörst du zu den Ersten, die sie sehen.
set_success = Erfolg! {c:main/botname} spricht jetzt {language} {usermode?mit dir|auf diesem Server}.
unset_success = Erfolg! {c:main/botname} spricht jetzt die Standardsprache ({language}) {usermode?mit dir|auf diesem Server}.

[help]
title = {c:main/botname} Hilfe
command_help = hilfe
command_help_desc = Erhalte Nutzungsinformationen für einen Befehl. Lass den Befehl leer für grundlegende Informationen.
command_help_command_desc = Nenne einen beliebigen Befehl für detaillierte Nutzungsinformationen.
command_help_help = {p:{cmd}} [command]
	Hebt einige nützliche Befehle hervor und erklärt die Verwendung der Präfixe.
	Wenn [command] gegeben wird, werden stattdessen Anweisungen zur Verwendung dieses Befehls gegeben.
command_about = info
command_about_desc = Informationen über {c:main/botname}, einschließlich eines Einladungslinks.
command_about_help = {p:{cmd}}
	Informationen über {c:main/botname}, einschließlich eines Einladungslinks.
command_changes = änderungen
command_changes_desc = Zeige eine Liste der letzten Änderungen an {c:main/botname} an.
command_changes_search_desc = Sieh dir Änderungen ab einer bestimmten Version an.
command_changes_help = {p:{cmd}} [version]
	Listet Änderungen auf, die seit dem letzten Update (oder einer von dir angegebenen Update-Versionsnummer) an {c:main/botname} vorgenommen wurden.
no_docs = {p:{cmd}} enthält derzeit keine Nutzungsinformationen.
future_command = {p:{cmd}} wird in einem zukünftigen Update kommen.
obsolete_command = {p:{cmd}} wurde entfernt, da es durch Änderungen an {c:main/botname} und Discord obsolet wurde.
moved_command = Die Funktionalität von {p:{oldcmd}} wurde nach {p:{cmd}} verschoben.
no_command = {p:{cmd}} existiert entweder nicht oder ist derzeit deaktiviert.
introduction = Erhalte Nutzungsinformationen für einen Befehl mit {p:help} [command].
	{videoexamples?Du kannst dir auch Videobeispiele auf der [Hilfe-Website]({c:help/helpurl}) ansehen.|}
	{serverinv?Erhalte engagierten Support vom Entwickler und anderen Benutzern auf dem [Support-Server]({serverinv}).|}
helpurl_cta = Gehe zu {c:help/helpurl}, um mehr zu erfahren!
creator_footer = {c:main/botname} v{c:main/ver} erstellt von {c:main/creator}
about_title = Über {c:main/botname}
bot_description = {c:main/botname} ist ein modularer Bot mit vielen lustigen, nützlichen, fairen und kostenlosen Funktionen. {c:main/botname} ist zudem Open Source, Leute sind willkommen, ihre eigenen Module unter {c:help/codeurl} beizusteuern.
about_field1_title = ✨ Funktionen
about_field1_value = {c:main/botname} hat {cmds} Befehle für {guilds} Server verfügbar.
	Mit den richtigen Modulen sollte {c:main/botname} fast alles können. Derzeit kann {c:main/botname} Reaktionsrollen, Umfragen, Serverreinigung, Würfel und benutzerdefinierte Emojis bereitstellen, und das alles in mehreren Sprachen!
about_field2_title = 🧠 Alles automatisch vervollständigen
about_field2_value = {c:main/botname}-Befehle verfügen über gründliche und intelligente Autovervollständigungs-Vorschläge für alle Parameter, was das Erlernen der Bedienung des Bots schmerzlos macht.
about_field3_title = 📚 Engagierte Unterstützung
about_field3_value = Mit {p:help} solltest du alles lernen können, was es über {c:main/botname} zu wissen gibt.
	{videoexamples?Videobeispiele, die die Verwendung von Befehlen demonstrieren, findest du auch auf der [Website]({c:help/helpurl}) von {c:main/botname}.|}
	{serverinv?Es gibt auch einen [Support-Server]({c:help/serverinv}), auf dem du Antworten auf alle Fragen erhältst und Demos sehen kannst.|}
about_field4_title = 🧩 Modulare Codebasis
about_field4_value = {c:main/botname} basiert auf dem modularen *Merely Framework*. Dieses Framework ermöglicht einfache Übersetzungen, unterbrechungsfreie Updates und einfache Erweiterbarkeit.
about_field5_title = ➕ Zu deinem Server hinzufügen
about_field5_value = Füge {c:main/botname} mit diesem Link zu deinem Discord-Server hinzu: {invite}
changelog_title = Änderungsprotokoll für {c:main/botname}
changelog_description = Liste der Änderungen von v{ver}:
changelog_cta = Sieh dir das vollständige Änderungsprotokoll online an: ({logurl})

[system]
command_module_help = {p:{cmd}} (erweiterung)
	Lade, entlade, lade neu, aktiviere und deaktiviere Erweiterungen, während du Änderungen am Quellcode vornimmst.
	Unterstützt auch das Hot-Reloading der Konfiguration, Babel-Übersetzungen und Systemmodule.
command_die_help = {p:{cmd}} [saveconfig]
	Fährt den Bot sicher herunter, speichert die Konfigurationsdatei manuell, wenn du dies angibst.
command_delete_message_help = {p:{cmd}} (channel-id) (message-id)
	Löscht jede Nachricht, für die der Bot die Berechtigung zum Löschen hat, von jedem Server, auf dem sich der Bot befindet.

[announce]
command_announce_help = {p:{cmd}}
	Erstelle eine Ankündigungsnachricht, die an alle Serverbesitzer (Opt-out) und andere Mitglieder (Opt-in) gesendet wird.
dm_subscription = Bot-Neuigkeiten in DMs erhalten
announce_title = Neue Ankündigung
announce_title_of = Ankündigungstitel
announce_content = Inhalt
announce_url = Link
announce_image = Bild
announce_unsubscribe_info = Verwende {p:controlpanel}, um den Empfang dieser Nachrichten zu beenden.
announce_in_progress = Du kannst keine weitere Ankündigung starten, da bereits eine läuft; {msglink}
announce_empty = Keine Abonnenten gefunden! Ankündigungen müssen mehrere Tage aktiv sein, um aktive Serverbesitzer zu finden.

[error]
missingrequiredargument = Ein erforderlicher Parameter für diesen Befehl fehlt oder ist ungültig.
noprivatemessage = Dieser Befehl kann nicht in privaten Nachrichten verwendet werden.
privatemessageonly = Dieser Befehl kann nur in privaten Nachrichten verwendet werden.
cooldown = Du musst noch {t} Sekunden warten, bevor du diesen Befehl wieder verwenden kannst.
commanderror = Beim Ausführen dieses Befehls ist ein Fehler aufgetreten. Bitte versuche es später erneut.\n```{error}```
timeoutview = Diese Nachricht ist abgelaufen und kann nicht mehr interagiert werden.
wronguser = Nur der Aufrufer dieses Befehls kann dieses Panel verwenden.
missingperms = {me?Ich benötige|Du benötigst} die folgenden Berechtigungen, um diesen Befehl hier auszuführen; {perms}

[premium]
command_premium = premium
command_premium_desc = Erfahre mehr über die Vorteile eines Premium-Abonnements.
command_premium_help = {p:{cmd}}
	Erfahre, wie du mit Premium mehr aus {c:main/botname} herausholen kannst.
required_title = {c:main/botname} Premium erforderlich!
required_error = Du musst {c:main/botname} Premium abonnieren, um diesen Befehl verwenden zu können.
	Verwende {p:premium}, um mehr zu erfahren und dich anzumelden!
required_advice = Wenn du bereits abonniert hast, stelle sicher, dass du auf dem Support-Server bist und die Rolle {role} hast.
owner_required_error = Dieser Bot ist derzeit deaktiviert, da die Person, die ihn in Auftrag gegeben hat, ihr Abonnement offenbar beendet oder den Support-Server verlassen hat.
	Tritt dem [Support-Server]({c:help/serverinv}) bei und sprich mit {c:main/creator}, wenn du diesen Bot wiederherstellen möchtest.
owner_required_advice = Der Besitzer muss auf dem Support-Server bleiben, um die Zahlung zu überprüfen.
name = {c:main/botname} Premium
desc = {c:main/botname} Premium unterstützt die Entwicklungs- und Hosting-Kosten, gibt dir aber auch Zugriff auf die folgenden zusätzlichen Funktionen;
feature_1 = Video-Downloads
feature_1_desc = Premium-Accounts können {p:download} verwenden, um Videos automatisch herunterzuladen und sie der Einfachheit halber als Nachricht auf Discord zu posten.
feature_2 = Vorrangige Übersetzung
feature_2_desc = Premium-Konten helfen bei der Finanzierung professioneller Übersetzungen, die das Erlebnis für alle drastisch verbessern. Die von Premium-Accounts verwendeten oder gewünschten Sprachen werden bei der Übersetzung priorisiert.
feature_3 = Vorrangige Unterstützung
feature_3_desc = Premium-Konten erhalten Zugriff auf einen Premium-Support-Kanal auf dem Support-Server. Fragen hier werden bei einem Rückstand immer zuerst beantwortet. Premium-Accounts haben auch mehr Einfluss auf neue Funktionen.
feature_4 = Geteiltes Premium
feature_4_desc = ConfessionBot Premium, MerelyBot Premium und die Beta-Gegenstücke werden alle geteilt. Das bedeutet, dass das Abonnieren von einem dir die Vorteile von allen bringt.
feature_custom = Hol dir einen benutzerdefinierten Bot
feature_custom_desc = Wenn du einen benutzerdefinierten Bot möchtest, setze dich mit {c:main/creator} im [Support-Server]({c:help/serverinv}) über deine Anforderungen in Verbindung. *Dies erfordert eine teurere Support-Stufe*.
fine_print = Du musst auf dem Bot-Support-Server bleiben, um weiterhin Premium-Funktionen nutzen zu können.
join_server_cta = Tritt dem Support-Server bei
subscribe_cta = Bezahle die Mitgliedschaft hier

[auth]
unauthorized = Du musst ein Serverbesitzer sein, um diesen Befehl zu verwenden!
not_admin = Du musst ein Admin sein, um diesen Befehl zu verwenden!
not_mod = Du musst ein Moderator sein, um diesen Befehl zu verwenden!
not_superuser = Du musst ein {c:main/botname}-Superuser sein, um diesen Befehl verwenden zu können! (Dies ist eine Liste von Benutzern, die von {c:main/creator} gepflegt wird).
not_authuser = Du musst ein {c:main/botname}-Authuser sein, um diesen Befehl verwenden zu können! (Dies ist eine Liste von Benutzern, die von {c:main/creator} gepflegt wird).

[example]
command_example_help = {p:{cmd}} (echo)
	Wiederholt deine Nachricht an dich zurück.
joined = {user} ist gerade dem Server beigetreten!
toggle = Beispiel umschalten
list = Beispiel auflisten
select = Beispiel auswählen
string = Beispiel für Zeichenfolge

[admin]
command_janitor_help = {p:{cmd}} (join [strict]|leave)
	Der Janitor löscht Nachrichten an und von {c:main/botname} nach 30 Sekunden automatisch.
	Wenn du das strict-Flag angibst, löscht der Janitor **alle** Nachrichten, die in diesem Kanal gesendet werden.
command_clean_help = {p:{cmd}} (n|start_id-end_id) [strict]
	Massenlöschung von Nachrichten aus einem Kanal. `n` gibt an, wie viele Nachrichten zurückgeschaut werden sollen. 'strict' löscht alle Nachrichten, anstatt nur Nachrichten an und von diesem Bot.
	Wenn du stattdessen zwei durch einen Bindestrich getrennte Nachrichten-IDs angibst, wird {cmd} auf diesen Bereich ausgeführt, anstatt von der aktuellen Nachricht zurückzuscannen.
janitor_set_success = Der Janitor für diesen Kanal wurde erfolgreich hinzugefügt oder aktualisiert.
janitor_unset_success = Der Janitor für diesen Kanal wurde erfolgreich entfernt.
clean_success = {n} Nachricht(en) erfolgreich gelöscht.
clean_failed = Das Bereinigen ist fehlgeschlagen. Dies liegt wahrscheinlich daran, dass die Berechtigungen "Nachrichtenverlauf lesen" und "Nachrichten verwalten" benötigt werden.
die_success = {restart?Wird neu gestartet...|Wird heruntergefahren...}

[eventmsg]
command_eventmessage_help = {p:{cmd}} (channel) (event) (action)
	Konfiguriere {c:main/botname}, um eine Aktion auszuführen, wann immer er ein angegebenes Ereignis auf deinem Server beobachtet.
	Diese Ereignisse werden auf allen Kanälen überwacht, die {c:main/botname} sehen kann, und eine Nachricht (falls zutreffend) wird an den von dir angegebenen Kanal gesendet.
	Ereignisse können später mit den gleichen Parametern bearbeitet werden. Der Kanal wird verworfen, wenn du `GRANT_XP` verwendest. Wenn die Aktion auf `NOTHING` gesetzt wird, wird das Ereignis gelöscht.
event_controlpanel = Verwende die folgenden Steuerelemente, um deinen Event-Handler zu konfigurieren.
	{message?\n**In {channel}:**\n> `{message}`\n|}{xp?*\n> Der Benutzer, der dieses Ereignis ausgelöst hat, erhält {xp} XP.*\n|}
	{usage?**Verfügbare Variablen (und Beispielwerte):**\n>>> |}{usage}

[greeter]
command_welcome_help = {p:{cmd}} (get|set|clear)
	Steuere die Willkommensnachricht für deinen Server.
	Verwende `get`, um Anweisungen zum Festlegen einer neuen Willkommensnachricht zu erhalten.
command_farewell_help = {p:{cmd}} (get|set|clear)
	Steuere die Abschiedsnachricht für deinen Server.
	Verwende `get`, um Anweisungen zum Festlegen einer neuen Abschiedsnachricht zu erhalten.
greeting_preview = Im {channel}: {message};
welcome_set_instructions = Um eine Willkommensnachricht festzulegen, verwende {p:welcome set} Willkommen, {} auf dem Server {}! (als Beispiel).
	*Das erste {} wird immer eine Erwähnung des Benutzers sein, und das zweite {} wird immer der aktuelle Servername sein.*
welcome_set_success = Willkommensnachricht erfolgreich festgelegt!
welcome_clear_success = Die Willkommensnachricht wurde entfernt und deaktiviert.
welcome_clear_failed = Du hast derzeit keine Willkommensnachricht festgelegt.
farewell_set_instructions = Um eine Abschiedsnachricht festzulegen, verwende {p:farewell set} Auf Wiedersehen, {} vom Server {}! (als Beispiel).
	*Das erste {} wird immer der Benutzername des gegangenen Benutzers sein, und das zweite {} wird immer der aktuelle Servername sein.*
farewell_set_success = Abschiedsnachricht erfolgreich festgelegt!
farewell_clear_success = Abschiedsnachricht entfernt und deaktiviert.
farewell_clear_failure = Du hast derzeit keine Abschiedsnachricht festgelegt.

[reactroles]
command_reactrole = reactrole
command_reactrole_desc = Erstelle eine Nachricht mit deiner Aufforderung für Reaktionen. Jede Reaktion kann mit Rollen verknüpft werden.
command_reactrole_topic_desc = Dies wird der Inhalt der Nachricht. Erkläre, dass das Reagieren hier Rollen gewährt.
command_reactrole_help = {p:{cmd}} (prompt)
	Erstellt eine Nachricht mit deiner angegebenen Aufforderung für Reaktionen. Jede bereitgestellte Reaktion kann mit Rollen verknüpft werden.
	Rollen werden allen Benutzern zugewiesen, die mit einer bestimmten Reaktion reagieren, selbst wenn der Bot offline ist.
	Benutzer können nicht mit anderen Emojis reagieren.
command_reactrole_add = reactrole_add
command_reactrole_add_desc = Fügt der aktuellen Entwurfsnachricht für Reaktionsrollen in diesem Kanal ein Emoji und Rollen hinzu.
command_reactrole_add_emoji_desc = Das Emoji, das zur Nachricht hinzugefügt werden soll.
command_reactrole_add_role_desc = Eine Rolle, die Benutzern gegeben wird, die mit dem Emoji reagieren.
command_reactrole_add_help = {p:{cmd}} (emoji) (role1) [rolen]
	Fügt der aktuellen Entwurfsnachricht für Reaktionsrollen in diesem Kanal ein Emoji und eine Rolle hinzu.
	Emojis können benutzerdefinierte Emojis auf diesem Server sein oder alle von Discord unterstützten universellen Emojis.
role_change = Deine Rollen in {server} wurden geändert;{taken? du hast die Rolle(n) {taken} verloren.|}{given? du hast die Rolle(n) {given} erhalten.|}
add_reaction = Reaktionsrolle hinzufügen
save_button = Speichern und aktivieren
howto_add_reaction = Verwende den Befehl {p:{cmd}} in diesem Kanal, um Reaktionsrollen hinzuzufügen.
no_draft = Keine Entwurfsnachricht für Reaktionsrollen gefunden! Verwende zuerst {p:reactrole}, um die Nachricht zu erstellen.
no_emoji = Dieses Emoji wurde nicht gefunden.
	*Versuche, Emojis zu durchsuchen und eines auszuwählen, wenn du das Feld `emoji:` ausfüllst.*
warn_unassignable = **Warnung:** {c:main/botname} kann einige dieser Rollen nicht zuweisen, da *{roles}* über der höchsten Rolle dieses Bots liegen; *("{myrole}")*.
emoji_added = Deine Reaktionsrolle wurde der Entwurfsnachricht oben hinzugefügt. Drücke auf Speichern, um sie zu veröffentlichen.
emoji_removed = Die Reaktionsrolle(n) {emoji} wurden entfernt.
draft_in_progress = Es gibt bereits eine Entwurfsnachricht für Reaktionsrollen in diesem Kanal. Bitte schließe diese zuerst ab.

[poll]
command_poll = poll
command_poll_desc = Erstelle eine interaktive Umfrage mit bis zu 10 Optionen und einem Ablaufdatum.
command_poll_title_desc = Das Thema der Umfrage.
command_poll_answer_desc = Eine von mehreren möglichen Antwortmöglichkeiten für die Umfrage.
command_poll_expiry_desc = Die Zeitspanne, bevor die Umfrage abläuft.
command_poll_help = {p:{cmd}} (title) (answer1) (answer2) [answerx] [expiryDays] [expiryHours] [expiryMinutes] [expirySeconds]
	Erstellt eine interaktive Umfrage.
	Du kannst bis zu 10 Auswahlmöglichkeiten angeben. Die Gesamtzeit aus den Ablaufparametern wird addiert.
poll_created = {author} hat eine Umfrage gestartet.
timenames = Jahr,Monat,Woche,Tag,Stunde,Minute,Sekunde
timeplurals = Jahre,Monate,Wochen,Tage,Stunden,Minuten,Sekunden
time_number_format = {number} {name}
inf_past = Vor langer Zeit geschlossen.
far_past = Vor {timelist} geschlossen.
near_past = Vor kurzem geschlossen.
present = Wird nun geschlossen.
near_future = Schließt sehr bald.
far_future = Schließt in {timelist}.
vote_cta = Reagieren um abzustimmen | Diese Umfrage hat{multichoice?| keine} Mehrfachauswahl
no_winner = Die Umfrage *"{title}"* ist ohne Stimmen abgelaufen.
one_winner = Der Gewinner der *"{title}"*-Umfrage ist **"{winner}"**.
multiple_winners = Die {num} Gewinner der Umfrage *"{title}"* sind **"{winners}"**.

[dice]
command_dice = dice
command_dice_desc = Würfeln. Unterstützt mehrere Würfel mit beliebig vielen Seiten.
command_dice_sides_desc = Die Anzahl der Seiten der Würfel, die du werfen möchtest. Verwende Kommas für mehrere Würfel.
command_dice_help = {p:{cmd}} [sides]
	Rollt beliebig viele Würfel mit einer beliebigen Anzahl von Seiten, die du angibst. Trenne jeden Würfel durch ein Komma *(zum Beispiel würde "4,6,8" einen 4-seitigen, einen 6-seitigen und einen 8-seitigen Würfel rollen)*.
	Standardmäßig ein 6-seitiger Würfel.
roll_result = Würfel #{i}: {r}
roll_error = Eine der von dir angegebenen Zahlen scheint ungültig zu sein.

[emoji]
command_emoji = emoji
command_emoji_desc = Durchsuche eine Vielzahl von Emojis und sende eines als Nachricht.
command_emoji_search_desc = Fange an zu tippen, um deine Suche zu verfeinern.
command_emoji_help = {p:{cmd}} (emoji name)
	Antwortet mit einem Emoji mit passendem Namen, das der Bot sehen kann.
	Lade {c:main/botname} auf weitere Server ein, um mehr Emojis zu erhalten.
not_found = Konnte kein Emoji mit diesem Namen finden.

[controlpanel]
command_controlpanel = controlpanel
command_controlpanel_desc = Öffne das Control Panel und personalisiere {c:main/botname} für dich und deinen Server.
command_controlpanel_help = {p:{cmd}}
	Öffnet das Control Panel, damit du {c:main/botname} für dich und deinen Server personalisieren kannst.
no_settings = Es sind derzeit keine Einstellungen verfügbar, die du steuern kannst!
bad_string = Diese Einstellung akzeptiert nur Zeichenfolgen in einem bestimmten Format. Bitte versuche es erneut oder wende dich an den Support.

[download]
command_download = download
command_download_desc = Lade ein Video von fast jeder Website herunter und lade es der Einfachheit halber wieder auf Discord hoch.
command_download_media_url_desc = Ein Link zu fast jedem frei verfügbaren Video im Web.
command_download_help = {p:{cmd}} (media_url)
	Lädt ein Video von fast jeder Website herunter (solange es frei verfügbar ist) und lädt es der Einfachheit halber wieder auf Discord hoch.
	Füge einfach die URL zu einer beliebigen Webseite mit einem Video ein, und er wird sich bemühen, es für dich herunterzuladen.
failed = **Download fehlgeschlagen!** - Einige Websites erfordern möglicherweise ein Login zum Herunterladen oder haben Maßnahmen, die das Herunterladen von Videos verhindern.
	*Stelle sicher, dass der Link zu einer Seite führt, auf der das Video im Mittelpunkt steht, und dass du dich nicht anmelden musst, um zu streamen.*
	{log}
invalid_url = Medien-URL scheint ungültig zu sein. Wird nicht heruntergeladen.
too_large = **Download fehlgeschlagen!** - Diese Medien überschreiten das 10MB-Limit von Discord.
